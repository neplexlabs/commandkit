packages:
  - packages/*
  - apps/*

preferWorkspacePackages: true

publicHoistPattern:
  - '@commandkit/*'

allowBuilds:
  '@swc/core': false
  cbor-extract: false
  core-js: false
  esbuild: true
  msgpackr-extract: false

catalogs:
  discordjs:
    discord.js: ^14.27.0
  build:
    typescript: ^5.9.3
    tsdown: ^0.22.12
  workflow:
    workflow: ^4.6.0
    '@workflow/builders': ^4.1.1
    '@workflow/rollup': ^4.0.11

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.24'
  - '@ai-sdk/google@4.0.19'
  - '@hono/node-server@2.0.11'
  - '@posthog/core@1.44.0'
  - ai@7.0.32
  - posthog-node@5.46.0
  - tar@7.5.3 || 7.5.4 || 7.5.7 || 7.5.8 || 7.5.10 || 7.5.11 || 7.5.16 || 7.5.17 || 7.5.18 || 7.5.19 || 7.5.21
  - serialize-javascript@7.0.3 || 7.0.5
  - uuid@11.1.1
  - brace-expansion@1.1.17 || 1.1.18 || 2.1.3 || 2.1.4 || 5.0.8 || 5.0.9
  - postcss@8.5.23
  - undici@6.28.0 || 7.29.0
  - fast-uri@3.1.5 || 3.1.6
  - hono@4.12.34 || 4.13.5
  - mermaid@11.16.1
  - js-yaml@3.15.1 || 3.15.2 || 4.3.1 || 4.3.2
  - dompurify@3.4.13
  - image-size@2.0.3
  - nanoid@3.3.18 || 5.1.11 || 5.1.16
  - browserslist@4.28.7
  - qs@6.15.4 || 6.16.0
  - joi@17.13.5 || 17.13.6
  - colord@2.9.4
  - vitest@4.1.11
  - '@vitest/mocker@4.1.11'
  - baseline-browser-mapping@2.11.0
  - svgo@3.3.5
  - devalue@5.9.1
